[project]
name = "autogen-kg-judge"
version = "0.1.0"
description = "RAGAS-based RAG evaluation (isolated uv environment)"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "numpy>=1.26.0",
    "openai>=2.32.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "ragas>=0.4.3",
    "rouge-score>=0.1.2",
    "sentence-transformers>=3.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
judge-cli = "judge.__main__:main"
ragas-context-metrics = "judge.context_ragas_cli:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge"]
